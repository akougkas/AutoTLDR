name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the complete Python 3.12 environment
        run: |
          uv venv --python 3.12
          uv sync --all-extras --dev
      - name: Run the warnings-as-errors acceptance suite
        run: uv run pytest
      - name: Build and audit release artifacts
        run: |
          uv build --out-dir dist
          uv run python scripts/check_release.py dist
      - name: Assemble the private-alpha participant bundle
        run: |
          uv run python scripts/build_alpha_bundle.py \
            dist alpha-bundle \
            --support "private GitHub security advisory"
